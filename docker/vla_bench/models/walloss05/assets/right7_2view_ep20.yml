# CONTAINER COPY of models/walloss05/right7_2view_ep20.yml -- the exact config the fine-tune ran with,
# with the six host paths rewritten for the image. NOTHING ELSE IS CHANGED; diff it against the
# workspace copy and you should see only the six path lines below plus this header.
#
# The adapter rebuilds the TRAINING data pipeline from this file (prompt text, camera mapping and
# ORDER, image resize chain, q01/q99 normalisation, 7 -> 26 padding, dof_mask), so it is part of the
# inference contract, not documentation. Most of the training-only sections (hyperparams, optimizer,
# scheduler, distributed, logging) are kept verbatim precisely so that diff stays honest; they are
# never read at inference.
#
# Rewritten:
#   data.lerobot_config.root  -> /opt/dataset_meta/right7_2view_v1  (188 KB of LeRobot meta/ baked into
#       the image; only `camera_keys` is read from it. Point it at a mounted dataset instead if you prefer.)
#   data.norm_stats_path      -> /opt/wallx_assets/right7_2view_norm_stats.json  (baked in)
#   model.processor_path      -> the revision-pinned Qwen2.5-VL-3B snapshot under the /hf mount. This one
#       is NOT optional and NOT the checkpoint: `DataCollator.load_processor` reads it while the data
#       pipeline is being built, well before the checkpoint overlay runs, and then adds <|propri|> and
#       <|action|> to that base vocabulary itself. Pointing it at the checkpoint's merged tokenizer is
#       a different tokenizer and a different image processor. (The MODEL's own processor is a separate
#       thing and does come from the checkpoint, via harrix `load_train_config_with_ckpt_overlay`.)
#   model.config_path         -> the revision-pinned wall-oss-0.5 snapshot config.json under /hf. In
#       practice `build_model_config` prefers <checkpoint>/config.json and never reaches this.
#   checkpoint.save_path / checkpoint.resume_from -> /models/walloss05 placeholders: training-only.
#
# Wall-OSS-0.5 fine-tune on the canonical right7_2view_v1 dataset (LeRobot v3.0, 30 fps).
# CAP VARIANT (Phase-4 candidate, decision recorded elsewhere) of right7_2view.yml.
# Derived from workspace/example/libero.yml @ wall-x ce2a1ae31d9ee1028b97ca40e3f66034cf8c0e5f (2026-09-11).
# Author values kept unless a comment says DEVIATION / ADAPTED. Companion cap variant: right7_2view_ep20.yml.
#
# Norm stats (run once, CPU; parquet only, no video decode):
#   python scripts/compute_norm_stats.py --train_config /lustre1/tier2/users/brahim.farhat/VLA-SOTA/models/walloss05/right7_2view.yml \
#          --data_root /lustre1/tier2/users/brahim.farhat/VLA-SOTA/data/lerobot_v3/right7_2view_v1
#   (--data_root is required since repo_id is now a bare name; the script otherwise treats repo_id as the path.)
# Launch (Phase 4, from /lustre1/tier2/users/brahim.farhat/VLA-SOTA/models/walloss05/repo; see ENV.md "Training launch"):
#   torchrun --nproc_per_node=8 wall_x/trainer/fsdp_trainer/train_fsdp.py --config /lustre1/tier2/users/brahim.farhat/VLA-SOTA/models/walloss05/right7_2view.yml --wandb_offline true
#
# Action space: 7-D absolute joint targets (right_joint_0..5 rad + right_joint_6 gripper carriage m) right-padded to the
# 26-D Wall-OSS-0.5 pretraining slot via action_padding (collator zero-pads, dof_mask=0 -> no loss on the pad).
# Dof-key names are free-form for the lerobot backend (only "relative" / "rotation"+"6D" substrings are interpreted);
# the names below are descriptive only. Norm stats are q01/q99 per dataset key (observation.state / action).

model_type: qwen2_5

task:
  # ADAPTED: 7 joint-space dims (6 arm joints + 1 gripper) + action_padding(19) = 26.
  dof_config:
    follow_right_arm_joint_pos: 6        # right_joint_0..5, absolute targets, rad
    follow_right_gripper: 1              # right_joint_6, gripper carriage position, m
    action_padding: 19
  ar_dof_config:
    follow_right_arm_joint_pos: 6
    follow_right_gripper: 1
    action_padding: 19
  # ADAPTED: state = the same 7 dims (observation.state) + action_padding(19) = 26.
  agent_pos_config:
    follow_right_arm_joint_pos: 6
    follow_right_gripper: 1
    action_padding: 19
  # ADAPTED: 1-second horizon at 30 fps (tech report: one-second chunk, frames per data-source rate).
  # Loader: delta_timestamps = [t/fps for t in range(action_horizon)] -> chunk of exactly 30 frames (T = 30).
  # (libero example: 10; author pretraining config.yml in the HF snapshot: action_horizon_flow 32.)
  action_horizon: 30
  action_horizon_flow: 30
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: /hf/hub/models--x-square-robot--wall-oss-0.5/snapshots/b7dc23a82dbf70a65859c9fdd596703234597028/config.json
  # REQUIRED at /hf. The training collator loads THIS processor (not the checkpoint's) and adds
  # <|propri|> / <|action|> to it -- see the header.
  processor_path: /hf/hub/models--Qwen--Qwen2.5-VL-3B-Instruct/snapshots/66285546d2b821cf421d4f5eb2576359d3770cd3
  pretrained_path: null                # DEVIATION (download budget): Qwen2.5-VL weights are NOT loaded first; wall-oss-0.5/model.safetensors
                                       # (checkpoint.resume_from) already contains the full VLM + action expert (4.16 B params) and the trainer
                                       # skips load_qwen_pretrain_weight() when this is null. Only the Qwen *processor* is used (processor_path).
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01

hyperparams:
  num_epoch: 20                        # DEVIATION (B6 cap): 20 epochs instead of the author 100
  batch_size_per_gpu: 4
  gradient_accumulation_steps: 4       # global batch = 4 x 4 x 8 GPUs = 128 sequences per optimizer step
  seed: 10222
  optimizer:
    optimizer_type: adamw              # all modules trainable (no freezing, no LoRA); dmuon not installed (pretraining-only dep)
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 1000
    num_training_steps: 21000        # DEVIATION: cosine horizon = expected steps for 20 epochs (~1,030 steps/epoch x 20; see ENV.md); also the hard stop
    min_lr: 1.0e-6

distributed:
  use_fsdp: true
  use_mixed_precision: true
  bf16: true

data:
  dataset_type: lerobot
  lerobot_config:
    # FIX (2026-09-15): repo_id doubles as the normalizer ParameterDict key
    # (build.py:42 dataset_name = repo_id; loader.py:658 batch["dataset_names"]) and
    # nn.ParameterDict forbids "." in a key -- an absolute path under .../brahim.farhat/...
    # raised KeyError('parameter name can\'t contain "."') (job 473252). Pass the dataset
    # directory as `root` and keep repo_id a bare, dot-free name. Nothing is fetched from
    # the Hub: LeRobotDataset(root=...) loads locally. This name is baked into the saved
    # normalizer, so inference must use the same repo_id.
    repo_id: right7_2view_v1
    root: /opt/dataset_meta/right7_2view_v1
  key_mappings:
    camera:
      observation.images.cam_high: face_view                 # ADAPTED camera mapping
      observation.images.cam_right_wrist: right_wrist_view   # ADAPTED camera mapping
    state: observation.state
    action: action
  norm_stats_path: /opt/wallx_assets/right7_2view_norm_stats.json
  # DEVIATION (B2: all 200 episodes train): the loader requires 0 < split < 1, so 0.995 -> int(200*0.995) = 199 train
  # episodes (1 episode unused). NOTE the author loader additionally holds out 5 % of *frames* (hard-coded
  # random_split [0.95, 0.05] in PreprocessedDataset) as an in-code validation split; not configurable.
  train_test_split: 0.995
  num_workers: 4
  max_length: 1024
  resolution:
    face_view: 256
    right_wrist_view: 256

logging:
  log_name: walloss05_right7_2view_ep20
  log_project: wall-oss-0.5      # W&B project == the model under test
  log_entity: tii-llm-optimization
  use_wandb: true
  wandb_offline: false                # online logging to the org W&B (human decision 2026-09-15)
  log_interval: 10
  save_interval: 1000000               # DEVIATION: step-based saves off (disk); epoch saves only
  val_interval: 1000000
  epoch_save_interval: 5               # DEVIATION: save at epochs 5,10,15,20 (~40 GB each incl. optimizer)

checkpoint:
  save_path: /models/walloss05/runs/right7_2view_ep20        # training-only, never written at inference
  # Single-file .safetensors = pretrain weights loaded before FSDP wrapping (Qwen2.5-VL weights are loaded first
  # from model.pretrained_path, then overwritten by this file; action-expert weights come only from here).
  resume_from: /models/walloss05/wall-oss-0.5/model.safetensors   # training-only, never read at inference

debug:
  profile: false
  nvtx: false
