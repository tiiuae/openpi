# vla-bench openvla_oft — one container, one checkpoint, the Trossen client's websocket protocol.
#
#   WEIGHTS_DIR=/opt/vla_weights HF_CACHE_DIR=$HOME/.cache/huggingface \
#     docker compose -f docker/vla_bench/compose/compose.openvla_oft.yml up --build
#
# Paths are host paths; both mounts are read-only EXCEPT /models, which openvla_oft must be able to rewrite —
# see docker/vla_bench/models/openvla_oft/README.md. CHECKPOINT is the path INSIDE the container.
services:
  vla-bench-openvla_oft:
    build:
      context: ../../..
      dockerfile: docker/vla_bench/models/openvla_oft/Dockerfile
    image: vla-bench-openvla_oft:latest
    container_name: vla-bench-openvla_oft
    ports:
      - "${PORT:-8800}:8800"
    command:
      - --checkpoint
      - ${CHECKPOINT:-/models/openvla_oft}
    volumes:
      - ${WEIGHTS_DIR:-/opt/vla_weights}:/models
      - ${HF_CACHE_DIR:-/opt/vla_hf_cache}:/hf:ro
    environment:
      - HF_HOME=/hf
      - HF_HUB_OFFLINE=1
      - VLA_BENCH_IMAGE=vla-bench-openvla_oft
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
