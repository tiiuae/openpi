# vla-bench pi05 — one container, one checkpoint, the Trossen client's websocket protocol.
#
#   WEIGHTS_DIR=/opt/vla_weights HF_CACHE_DIR=$HOME/.cache/huggingface \
#     docker compose -f docker/vla_bench/compose/compose.pi05.yml up --build
#
# Paths are host paths; both mounts are read-only. CHECKPOINT is the path INSIDE the container.
# pi05 reads nothing from /hf (its tokenizer ships in the upload set, under /models/pi05); the mount is kept
# only so every compose file has the same shape.
services:
  vla-bench-pi05:
    build:
      context: ../../..
      dockerfile: docker/vla_bench/models/pi05/Dockerfile
    image: vla-bench-pi05:latest
    container_name: vla-bench-pi05
    ports:
      - "${PORT:-8800}:8800"
    command:
      - --checkpoint
      - ${CHECKPOINT:-/models/pi05}
    volumes:
      - ${WEIGHTS_DIR:-/opt/vla_weights}:/models:ro
      - ${HF_CACHE_DIR:-/opt/vla_hf_cache}:/hf:ro
    environment:
      - HF_HOME=/hf
      - HF_HUB_OFFLINE=1
      - VLA_BENCH_IMAGE=vla-bench-pi05
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
