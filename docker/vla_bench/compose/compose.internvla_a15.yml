# vla-bench internvla_a15 — one container, one checkpoint, the Trossen client's websocket protocol.
#
#   WEIGHTS_DIR=/opt/vla_weights HF_CACHE_DIR=$HOME/.cache/huggingface \
#     docker compose -f docker/vla_bench/compose/compose.internvla_a15.yml up --build
#
# Paths are host paths; both mounts are read-only. CHECKPOINT is the path INSIDE the container.
services:
  vla-bench-internvla_a15:
    build:
      context: ../../..
      dockerfile: docker/vla_bench/models/internvla_a15/Dockerfile
    image: vla-bench-internvla_a15:latest
    container_name: vla-bench-internvla_a15
    ports:
      - "${PORT:-8800}:8800"
    command:
      - --checkpoint
      - ${CHECKPOINT:-/models/internvla_a15/runs/2026_09_15_17_09_12-internvla_a1_5-right7_2view_v1-abs-a15_pretrain-cap15k-finetune/checkpoints/015000/pretrained_model}
    volumes:
      - ${WEIGHTS_DIR:-/opt/vla_weights}:/models:ro
      - ${HF_CACHE_DIR:-/opt/vla_hf_cache}:/hf:ro
    environment:
      - HF_HOME=/hf
      - HF_HUB_OFFLINE=1
      - VLA_BENCH_IMAGE=vla-bench-internvla_a15
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
