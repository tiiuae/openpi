# vla-bench gigabrain07 — one container, one checkpoint, the Trossen client's websocket protocol.
#
#   WEIGHTS_DIR=/opt/vla_weights HF_CACHE_DIR=$HOME/.cache/huggingface \
#     docker compose -f docker/vla_bench/compose/compose.gigabrain07.yml up --build
#
# Paths are host paths; both mounts are read-only. CHECKPOINT is the path INSIDE the container.
services:
  vla-bench-gigabrain07:
    build:
      context: ../../..
      dockerfile: docker/vla_bench/models/gigabrain07/Dockerfile
    image: vla-bench-gigabrain07:latest
    container_name: vla-bench-gigabrain07
    ports:
      - "${PORT:-8800}:8800"
    command:
      - --checkpoint
      - ${CHECKPOINT:-/models/gigabrain07}
    volumes:
      - ${WEIGHTS_DIR:-/opt/vla_weights}:/models:ro
      - ${HF_CACHE_DIR:-/opt/vla_hf_cache}:/hf:ro
    environment:
      - HF_HOME=/hf
      - HF_HUB_OFFLINE=1
      - VLA_BENCH_IMAGE=vla-bench-gigabrain07
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
