[project]
name = "gcp-ckpt-downloader"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
gcp-ckpt-downloader = "gcp_ckpt_downloader.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"gcp_ckpt_downloader" = "."}
packages = ["gcp_ckpt_downloader"]

[tool.setuptools.package-data]
gcp_ckpt_downloader = ["static/**"]
