[project]
name = "gcp-ckpt-downloader"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
gcp-ckpt-downloader = "gcp_ckpt_downloader.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"gcp_ckpt_downloader" = "."}
packages = ["gcp_ckpt_downloader"]

[tool.setuptools.package-data]
# "static/**" alone misses dotfiles (glob's standard hidden-file exclusion),
# so also list static/.gitkeep explicitly (a literal, non-wildcard path is
# not subject to that exclusion) -- this guarantees the static/ directory
# itself always ships, even before Task 5 adds real (non-dot) frontend
# files that "static/**" will pick up on its own.
gcp_ckpt_downloader = ["static/**", "static/.gitkeep"]
