<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trossen Control — Replay</title>
  <link rel="stylesheet" href="/static/theme.css?v=feedback-modal">
  <link rel="icon" type="image/png" href="/static/robot-arm.png">
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/vendor/chartjs-plugin-zoom.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three":               "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/":       "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "urdf-loader":         "/static/vendor/URDFLoader.js"
    }
  }
  </script>
</head>
<body>
  <header class="app-header">
    <div class="app-nav"></div>
    <script type="module" src="/static/js/nav.js?v=feedback-button"></script>
  </header>

  <div class="live-grid replay-grid">
    <aside id="config-col" class="replay-sidebar">
      <section class="card replay-dataset-card"><h2>Dataset</h2>
        <div class="input-browse replay-path-row"><input id="dataset_dir" type="text" placeholder="dataset directory">
          <button class="btn-icon" id="btn-browse-dataset">📁</button></div>
        <div class="replay-field-stack">
          <div class="field-inline"><label>Episode</label><select id="episode-select"></select></div>
          <div class="field-inline"><label>Mode</label>
            <select id="mode-select"><option value="test">Dry run — preview only</option><option value="autonomous">Run on real robot</option></select></div>
        </div>
        <div class="replay-action-group">
          <span class="field-hint">Preview</span>
          <button class="btn-primary" id="btn-preview">Preview</button>
        </div>
        <div class="replay-action-group">
          <span class="field-hint">Hardware replay</span>
          <div class="status-strip">
            <span class="badge" id="badge-session">idle</span>
          </div>
          <div class="replay-run-controls">
            <button class="btn-primary" id="btn-replay">Replay Episode</button>
            <button class="btn-outline" id="btn-stop">Stop</button>
            <button class="btn-danger" id="btn-estop">E-STOP</button>
          </div>
        </div>
        <div class="replay-action-group">
          <span class="field-hint">Robot pose</span>
          <div class="replay-pose-controls">
            <button class="btn-outline" id="btn-home">Home</button>
            <button class="btn-outline" id="btn-sleep">Sleep</button>
          </div>
        </div>
      </section>
      <section class="card" id="replay-config-card"><h2>Replay config</h2>
        <div class="replay-config-group">
          <span class="field-hint">Timing</span>
          <div class="field-inline"><label>Control rate (Hz)</label>
            <input type="number" id="cf_control_freq" value="0" min="0" step="1" title="0 = use the episode's recorded fps"></div>
          <div class="field-inline"><label>Goal-time multiplier</label>
            <input type="number" id="cf_min_time_to_move_multiplier" value="10.0" step="0.5" min="0" title="Autonomous only. Driver goal_time = multiplier / loop rate. Larger = smoother/laggier. 10.0 removes small per-frame joint shake."></div>
          <div class="field-inline"><label>Driver loop rate (Hz)</label>
            <input type="number" id="cf_loop_rate" value="30" step="1" min="1" title="Autonomous only. Driver loop rate."></div>
        </div>
        <div class="replay-config-group">
          <span class="field-hint">IK / safety</span>
          <div class="field-inline"><label>Max joint speed (rad/s)</label>
            <input type="number" id="cf_max_joint_speed" value="3.0" step="0.5" min="0" title="Per-joint velocity cap; spikes above this are flagged. 0 disables."></div>
          <div class="field-inline"><label>IK orientation weight</label>
            <input type="number" id="cf_ik_orientation_weight" value="0.01" step="0.01" min="0" title="How tightly IK tracks recorded EE orientation vs position. Low values let the wrist drift/flip (aggressive joints while EE stays smooth) — raise toward 1.0 to constrain it."></div>
          <div class="field-inline"><label>IK position tol (m)</label>
            <input type="number" id="cf_ik_pos_tol_m" value="0.001" step="0.001" min="0" title="Acceptable IK position error in metres."></div>
          <div class="field-inline"><label>IK max joint jump (deg)</label>
            <input type="number" id="cf_ik_max_joint_jump_deg" value="45" step="5" min="0" title="Reject any single IK solve whose joint angle jumps more than this vs the previous frame (a branch flip) and hold the last good pose instead. 0 disables. Catches chaotic end/mid-episode flips that orientation weight can't."></div>
        </div>
      </section>
    </aside>
    <main class="live-main">
      <section class="card">
        <div class="preview-hdr">
          <h2>Episode preview</h2>
        </div>
        <div class="spike-banner" id="spike-banner" style="display:none"></div>
        <div class="urdf-wrap"><canvas id="urdf-canvas"></canvas>
          <div class="cam-views" id="cam-views">
            <button class="btn-sm" data-view="iso">Iso</button>
            <button class="btn-sm" data-view="front">Front</button>
            <button class="btn-sm" data-view="top">Top</button>
            <button class="btn-sm" data-view="left">L</button>
            <button class="btn-sm" data-view="right">R</button>
          </div>
        </div>
        <div class="chart-cj-container"><canvas id="chart-joints"></canvas></div>
        <div class="chart-cj-container"><canvas id="chart-vel"></canvas></div>
        <div class="chart-cj-container"><canvas id="chart-ee"></canvas></div>
        <div class="transport" id="transport">
          <button class="btn-sm" id="tp-play">▶ Play</button>
          <button class="btn-sm" id="tp-stop">⏹ Stop</button>
          <button class="btn-sm" id="tp-reset" title="Reset all charts to the full time window">⤢ Reset view</button>
          <input type="range" id="tp-slider" min="0" max="0" value="0" style="flex:1">
          <span id="tp-readout" class="counter">— / —</span>
          <label>Speed
            <select id="tp-speed">
              <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
              <option value="1" selected>1×</option><option value="2">2×</option>
            </select>
          </label>
        </div>
      </section>
      <section class="card"><div class="log-header"><h2>Logs</h2><button class="btn-sm" id="btn-clear-log">Clear</button></div>
        <div class="log-panel" id="log-box"></div></section>
    </main>
  </div>

  <div class="modal-overlay" id="modal-filebrowser" style="display:none">
    <div class="modal-box">
      <div class="modal-titlebar">Select dataset folder <button class="btn-close" id="btn-cancel-browser">×</button></div>
      <div class="browser-path-bar"><span class="browser-path-text" id="browser-current-path"></span></div>
      <div class="browser-entries" id="browser-entries"></div>
      <div class="modal-footer"><button class="btn-primary" id="btn-select-dir">Select this folder</button></div>
    </div>
  </div>
  <div class="modal-overlay" id="modal-spike" style="display:none">
    <div class="modal-box">
      <div class="modal-titlebar" style="background:#5a1111">⚠ Velocity spikes detected</div>
      <div style="padding:16px">
        <p id="spike-msg" style="color:#ffb4b4"></p>
        <p>Replaying this episode may command an aggressive movement and damage the robot.</p>
        <label style="display:flex;gap:8px;align-items:center;margin-top:12px">
          <input type="checkbox" id="spike-ack"> I understand the risk, run anyway
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" id="spike-cancel">Cancel</button>
        <button class="btn-danger" id="spike-confirm" disabled>Replay Episode</button>
      </div>
    </div>
  </div>
  <script type="module" src="/static/js/replay.js?v=feedback-modal"></script>
</body>
</html>
